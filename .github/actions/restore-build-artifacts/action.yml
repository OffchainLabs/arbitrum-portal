name: Restore build artifacts
description: Wait for this run's build artifact, then restore it

runs:
  using: composite
  steps:
    # Jobs that use the build start alongside it rather than after it, so their setup overlaps
    # the build. Fails fast if the build failed rather than waiting out the timeout. Needs the
    # `actions: read` permission.
    - name: Wait for the build
      shell: bash
      run: |
        deadline=$((SECONDS + 900))
        while [ $SECONDS -lt $deadline ]; do
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=build-artifacts" --jq '.total_count')
          [ "$count" != 0 ] && exit 0
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select((.name | endswith("Build")) and .status == "completed" and .conclusion != "success")] | length')
          [ "$failed" != 0 ] && { echo "The build job failed"; exit 1; }
          sleep 3
        done
        echo "Timed out waiting for the build artifact"
        exit 1
      env:
        GH_TOKEN: ${{ github.token }}

    # The artifact's root is packages/app, the common folder of the uploaded paths. The 53 MB
    # download takes ~3s but about 1 in 60 stalls for minutes, so time it out and retry.
    - name: Restore build artifacts
      shell: bash
      run: |
        for attempt in 1 2 3; do
          dir="$RUNNER_TEMP/build-artifacts-$attempt"
          if timeout 45 gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n build-artifacts -D "$dir"; then
            cp -a "$dir/." ./packages/app/
            exit 0
          fi
          echo "Download attempt $attempt failed or timed out"
        done
        exit 1
      env:
        GH_TOKEN: ${{ github.token }}

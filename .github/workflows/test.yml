name: Test

on:
  pull_request:
    branches: ['master']
    types:
      - opened
      - reopened
      - synchronize
      # we skip ci for draft PRs
      # https://github.com/reviewdog/action-eslint/issues/29#issuecomment-985939887
      - ready_for_review
  workflow_dispatch:
  merge_group:

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  # Draft and ready runs use separate groups. A run for a push made while the PR was a draft
  # can start after the PR is marked ready, and would otherwise cancel the ready run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

jobs:
  check-files:
    name: Check files
    runs-on: ubuntu-4
    outputs:
      run_tests: ${{ steps.check-files.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-files
        id: check-files

  build:
    name: 'Build'
    needs: [check-files]
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # The UI test jobs start alongside the build; restore-build-artifacts waits for it.
  test-ui:
    name: 'Test UI Unit'
    runs-on: ubuntu-latest
    needs: [check-files]
    if: needs.check-files.outputs.run_tests == 'true' && github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
    env: &app_env
      NEXT_PUBLIC_RPC_PROVIDER: alchemy
      NEXT_PUBLIC_INFURA_KEY: ${{ secrets.NEXT_PUBLIC_INFURA_KEY }}
      NEXT_PUBLIC_ALCHEMY_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_KEY }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      NEXT_PUBLIC_FEATURE_FLAG_LIFI: ${{ secrets.NEXT_PUBLIC_FEATURE_FLAG_LIFI }}
      THE_GRAPH_NETWORK_API_KEY: ${{ secrets.THE_GRAPH_NETWORK_API_KEY }}
      INDEXER_API_URL_BY_CHAIN: ${{ secrets.INDEXER_API_URL_BY_CHAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          install-command: pnpm install --frozen-lockfile
          cache-key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
          save: ${{ github.ref == 'refs/heads/master' }}

      # The first pnpm command in a job spends ~23s checking the lockfile against the supply-chain
      # policies. Pay it while the build runs rather than before the tests.
      - name: Check the lockfile in the background
        run: pnpm --filter arb-token-bridge-ui exec true > "$RUNNER_TEMP/pnpm-check.log" 2>&1 &

      - name: Restore build artifacts
        uses: ./.github/actions/restore-build-artifacts

      - name: Start UI and run unit tests
        run: pnpm start-server-and-test 'start' http://127.0.0.1:3000 'pnpm test:unit'

  test-ui-integration:
    name: 'Test UI Integration (${{ matrix.shard.name }})'
    runs-on: ubuntu-latest
    needs: [check-files]
    if: needs.check-files.outputs.run_tests == 'true' && github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The default token files each run their tests one at a time for about a minute, so
        # each gets a job. Vitest's --shard splits by file and can put them together.
        shard:
          - { name: 'default tokens 1', args: 'TransferPanel.default-tokens.integration' }
          - { name: 'default tokens 2', args: 'TransferPanel.default-tokens-2' }
          - { name: 'default tokens 3', args: 'TransferPanel.default-tokens-3' }
          - { name: 'default tokens 4', args: 'TransferPanel.default-tokens-4' }
          - { name: 'other', args: "--exclude '**/TransferPanel.default-tokens*'" }
    env: *app_env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          install-command: pnpm install --frozen-lockfile
          cache-key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
          save: ${{ github.ref == 'refs/heads/master' }}

      # The first pnpm command in a job spends ~23s checking the lockfile against the supply-chain
      # policies. Pay it while the build runs rather than before the tests.
      - name: Check the lockfile in the background
        run: pnpm --filter arb-token-bridge-ui exec true > "$RUNNER_TEMP/pnpm-check.log" 2>&1 &

      - name: Restore build artifacts
        uses: ./.github/actions/restore-build-artifacts

      - name: Start UI and run integration tests
        run: pnpm start-server-and-test 'start' http://127.0.0.1:3000 "pnpm test:integration ${{ matrix.shard.args }}"

  audit:
    name: 'Audit'
    runs-on: ubuntu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          install-command: pnpm install --frozen-lockfile
          cache-key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Run audit
        run: pnpm audit:ci

  # Runs on draft PRs too, without waiting for the build
  check-formatting:
    name: 'Check Formatting'
    runs-on: ubuntu-4
    env: *app_env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          install-command: pnpm install --frozen-lockfile
          cache-key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
          save: ${{ github.ref == 'refs/heads/master' }}

      # `tsc` reads the portal data
      - name: Fetch portal data
        run: pnpm --filter portal fetch:data

      - name: Check formatting with Prettier
        run: pnpm prettier:check

      - name: Check formatting with ESLint
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: pnpm lint

  # Doesn't need the build: each e2e job sets up alongside it and waits for its artifact.
  e2e-tests:
    name: 'E2E Tests'
    needs: [check-files]
    if: needs.check-files.outputs.run_tests == 'true' && github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-tests.yml
    with:
      test_type: 'regular'
    secrets: inherit

  test-e2e-success:
    name: 'Test E2E Success'
    runs-on: ubuntu-4
    needs: [e2e-tests]
    if: always()
    steps:
      - name: Regular E2E Succeeded
        if: needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped'
        run: echo "Regular E2E tests passed"

      - name: Regular E2E Failed
        if: needs.e2e-tests.result != 'success' && needs.e2e-tests.result != 'skipped'
        run: exit 1

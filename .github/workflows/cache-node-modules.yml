# PRs can only restore caches saved on their own ref or on master.
# Saving node_modules and Chrome on master lets every PR reuse one cache entry for each,
# instead of each PR saving its own copy and pushing the repo past its 10GB cache limit.
name: Cache dependencies

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-node-modules:
    name: Cache node_modules
    runs-on: ubuntu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install node_modules
        # TODO: back to @main once OffchainLabs/actions#46 merges
        uses: OffchainLabs/actions/node-modules/install@ad07ad618c95e22537c3bfc9d8bfaa6a60e16d0d
        with:
          install-command: pnpm install --frozen-lockfile
          cache-key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Chrome for Testing
        uses: ./.github/actions/install-chrome

name: Lighthouse

permissions:
  actions: read
  contents: read
  pull-requests: write

on:
  # Runs on master are the baseline that pull requests are compared against
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_RPC_PROVIDER: alchemy
  NEXT_PUBLIC_INFURA_KEY: ${{ secrets.NEXT_PUBLIC_INFURA_KEY }}
  NEXT_PUBLIC_ALCHEMY_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_KEY }}
  NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
  VAULTS_FYI_API_KEY: ${{ secrets.VAULTS_FYI_API_KEY }}
  THE_GRAPH_NETWORK_API_KEY: ${{ secrets.THE_GRAPH_NETWORK_API_KEY }}
  INDEXER_API_URL_BY_CHAIN: ${{ secrets.INDEXER_API_URL_BY_CHAIN }}
  APP_URL: http://localhost:3000

jobs:
  lighthouse:
    name: Run Lighthouse
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          install-command: pnpm install --frozen-lockfile
          cache-key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      # Use the pinned Chrome for Testing, so results don't shift with runner image updates
      - name: Locate Chrome for Testing
        run: |
          chrome_version=$(node -p "require('./package.json').config.chromeVersion")
          echo "CHROME_PATH=$PWD/node_modules/.cache/synpress/chrome/linux-$chrome_version/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Start server
        run: |
          pnpm start &
          # Wait for the server, then warm it up so no measured run hits a cold server
          curl --silent --fail --output /dev/null --retry 30 --retry-connrefused --retry-delay 2 "$APP_URL/bridge"
          curl --silent --fail --output /dev/null "$APP_URL/bridge"

      - name: Run Lighthouse
        run: node .github/lighthouse/flow.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: warn

      - name: Download master baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(gh run list --workflow lighthouse.yml --branch master --event push --status success --limit 1 --json databaseId,headSha --jq '.[0] // empty')
          if [ -n "$baseline" ]; then
            run_id=$(jq -r .databaseId <<< "$baseline")
            gh run download "$run_id" --name lighthouse-reports --dir lighthouse-baseline
            echo "BASELINE_RUN_ID=$run_id" >> "$GITHUB_ENV"
            echo "BASELINE_SHA=$(jq -r .headSha <<< "$baseline")" >> "$GITHUB_ENV"
          fi

      - name: Report results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = require('./.github/lighthouse/report.js')
            await report({ github, context, core })

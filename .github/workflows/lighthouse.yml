name: Lighthouse

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: ['master']
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_RPC_PROVIDER: alchemy
  NEXT_PUBLIC_INFURA_KEY: ${{ secrets.NEXT_PUBLIC_INFURA_KEY }}
  NEXT_PUBLIC_ALCHEMY_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_KEY }}
  NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
  VAULTS_FYI_API_KEY: ${{ secrets.VAULTS_FYI_API_KEY }}
  THE_GRAPH_NETWORK_API_KEY: ${{ secrets.THE_GRAPH_NETWORK_API_KEY }}
  INDEXER_API_URL_BY_CHAIN: ${{ secrets.INDEXER_API_URL_BY_CHAIN }}
  PR_URL: http://localhost:3000
  BASE_URL: http://localhost:3001

jobs:
  lighthouse:
    name: Run Lighthouse
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          install-command: pnpm install --frozen-lockfile
          cache-key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Build PR
        run: pnpm build

      # Measure the base build on the same runner, so the comparison isn't skewed by hardware differences
      - name: Checkout base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Build base
        working-directory: base
        run: pnpm install --frozen-lockfile && pnpm build

      # Use the pinned Chrome for Testing, so results don't shift with runner image updates
      - name: Locate Chrome for Testing
        run: |
          chrome_version=$(node -p "require('./package.json').config.chromeVersion")
          echo "CHROME_PATH=$PWD/node_modules/.cache/synpress/chrome/linux-$chrome_version/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Start servers
        run: |
          PORT=3000 pnpm start &
          (cd base && PORT=3001 pnpm start) &
          # Wait for both servers, then warm them up so no measured run hits a cold server
          for url in "$PR_URL/bridge" "$BASE_URL/bridge"; do
            curl --silent --fail --output /dev/null --retry 30 --retry-connrefused --retry-delay 2 "$url"
            curl --silent --fail --output /dev/null "$url"
          done

      - name: Run Lighthouse
        run: node .github/lighthouse/flow.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: warn

      - name: Report results
        uses: actions/github-script@v7
        with:
          script: |
            const report = require('./.github/lighthouse/report.js')
            await report({ github, context, core })

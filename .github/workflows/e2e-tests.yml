name: E2E tests

on:
  workflow_call:
    inputs:
      test_type:
        required: true
        type: string

env:
  NEXT_PUBLIC_RPC_PROVIDER: alchemy
  NEXT_PUBLIC_INFURA_KEY: ${{ secrets.NEXT_PUBLIC_INFURA_KEY }}
  NEXT_PUBLIC_ALCHEMY_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_KEY }}
  NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
  INDEXER_API_URL_BY_CHAIN: ${{ secrets.INDEXER_API_URL_BY_CHAIN }}
  NEXT_PUBLIC_INDEXER_CHILD_CHAIN_IDS: ${{ vars.NEXT_PUBLIC_INDEXER_CHILD_CHAIN_IDS }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  load-e2e-files:
    name: 'Load e2e files'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.e2eFiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: set-matrix
        run: echo "e2eFiles=$(node .github/workflows/formatSpecfiles.js ${{ inputs.test_type }} | jq . --compact-output)" >> $GITHUB_OUTPUT

  test-e2e:
    name: 'Test E2E - ${{ matrix.test.name }} ${{ matrix.test.typeName }}'
    # Called by test.yml after its build job, so the build artifacts already exist
    needs: [load-e2e-files]
    # GitHub's standard runners, free for public repos. The org's ubuntu-8 pool is shared, and with
    # 51 jobs they waited up to 16 min for it.
    runs-on: ubuntu-latest
    # Healthy jobs take 3-5 min. A degraded runner (slow restores, page loads timing out) can
    # otherwise hold the run for 20+ min.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.load-e2e-files.outputs.matrix) }}

    steps:
      # Litro v0.6.9 with the e2e setup prebaked (see e2e-testnode-images.yml). Started in the
      # background rather than as a service container: a service is pulled before the first step
      # and stopped after the last, which added 40-100s per job. L1 mines every 250ms instead of
      # 1s, so withdrawals turn claimable and deposits land sooner.
      - name: Start testnode
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name testnode -e TESTNODE_VARIANT=${{ matrix.test.tag }} \
            -e TESTNODE_L1_BLOCK_TIME=0.25 \
            -p 8080:8080 -p 8545:8545 -p 8547:8547 -p 3347:8549 \
            ghcr.io/offchainlabs/arbitrum-portal-e2e-testnode:v0.6.9-nc3.2-${{ matrix.test.tag }}-r2 \
            > "$RUNNER_TEMP/testnode.log" 2>&1 &
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          install-command: pnpm install --frozen-lockfile
          cache-key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
          save: ${{ github.ref == 'refs/heads/master' }}

      # Synpress/MetaMask 11.15.0 is a Manifest V2 extension that Playwright's bundled Chromium
      # refuses to load. fixtures.ts launches the pinned Chrome for Testing (Chrome 128, MV2) from
      # node_modules/.cache/synpress instead. `postinstall` skips it on CI, so install it here.
      # The first pnpm command in a job spends ~23s checking the lockfile against the supply-chain
      # policies. Pay it here, while the build runs, rather than before the tests.
      - name: Check the lockfile in the background
        run: pnpm --filter arb-token-bridge-ui exec true > "$RUNNER_TEMP/pnpm-check.log" 2>&1 &

      - name: Install pinned Chrome for Testing
        uses: ./.github/actions/install-chrome

      # The image's HEALTHCHECK polls all chain RPCs, so healthy means the config is ready.
      - name: Fetch testnode config
        run: |
          timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" testnode 2>/dev/null)" = healthy ]; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/testnode.log"; docker logs testnode; exit 1; }
          curl -sf http://localhost:8080/config/localNetwork.json -o packages/arb-token-bridge-ui/src/util/networksNitroTestnode.generated.json

      # The ubuntu-24.04 runner image already has Xvfb and Chrome's libraries.
      - name: Run xvfb
        run: Xvfb :0 -screen 0 1366x768x24 -listen tcp -ac &

      # A MetaMask profile saved right after setup (see fixtures.ts), so most jobs only unlock it.
      # Its vault password comes from the wallet's secret key, so the cached copy is safe to share.
      # fixtures.ts rebuilds a profile whose wallet or networks differ from the current ones. Bump
      # the version when setUpMetamask changes in another way.
      - name: Cache MetaMask profile
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/metamask-profile
          key: ${{ runner.os }}-metamask-v1-${{ matrix.test.type }}-${{ hashFiles('package.json') }}

      - name: Run e2e tests (Playwright)
        # Playwright starts while the build may still be running: launching Chrome and unlocking
        # MetaMask doesn't need the app, and fixtures.ts waits for it before the first test. The
        # build is restored and served in the background. next is run directly because the first
        # pnpm command in a job spends ~23s checking the lockfile.
        run: |
          (
            .github/scripts/restore-build-artifacts.sh
            cd packages/app && exec ./node_modules/.bin/next start
          ) > "$RUNNER_TEMP/app.log" 2>&1 &
          pnpm test:e2e ${{ matrix.test.files }} ${E2E_GREP:+--grep "$E2E_GREP"} || { cat "$RUNNER_TEMP/app.log"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_WAIT_FOR_APP: true
          E2E_GREP: ${{ matrix.test.grep }}
          E2E_METAMASK_PROFILE: ${{ runner.temp }}/metamask-profile
          DISPLAY: :0.0
          E2E_ORBIT: ${{ matrix.test.type == 'orbit-eth' }}
          E2E_ORBIT_CUSTOM_GAS_TOKEN: ${{ startsWith(matrix.test.type, 'orbit-custom') }}
          ORBIT_CUSTOM_GAS_TOKEN: ${{ startsWith(matrix.test.type, 'orbit-custom') }}
          METAMASK_VERSION: 11.15.0
          SKIP_METAMASK_SETUP: true
          RECORD_VIDEO: ${{ matrix.test.recordVideo }}
          PRIVATE_KEY_CUSTOM: ${{ secrets.E2E_PRIVATE_KEY }}
          PRIVATE_KEY_USER: ${{ secrets.E2E_PRIVATE_KEY_USER }}
          NEXT_PUBLIC_IS_E2E_TEST: true
          NEXT_PUBLIC_RPC_PROVIDER: alchemy
          NEXT_PUBLIC_INFURA_KEY: ${{ secrets.NEXT_PUBLIC_INFURA_KEY }}
          NEXT_PUBLIC_ALCHEMY_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_KEY }}
          NEXT_PUBLIC_RPC_URL_NITRO_TESTNODE_L1: http://127.0.0.1:8545
          NEXT_PUBLIC_RPC_URL_NITRO_TESTNODE_L2: http://127.0.0.1:8547
          NEXT_PUBLIC_RPC_URL_NITRO_TESTNODE_L3: http://127.0.0.1:3347

      - name: Archive e2e artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts-${{ github.sha }}-${{ matrix.test.name }}-${{ matrix.test.type }}
          path: |
            ./packages/arb-token-bridge-ui/test-results
            ./packages/arb-token-bridge-ui/playwright-report
          if-no-files-found: 'ignore'
        continue-on-error: true

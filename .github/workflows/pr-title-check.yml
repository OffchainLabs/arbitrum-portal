name: 'PR Title Check'
# PR title is checked according to https://www.conventionalcommits.org/en/v1.0.0/

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
  merge_group:

jobs:
  main:
    name: Validate PR title
    # The action needs a pull_request payload, which merge_group events don't have. The title was
    # already checked on the PR, and a skipped job counts as passing for a required check
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-4
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: '^.{0,50}$'
